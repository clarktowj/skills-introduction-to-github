app:
  name: 机电AI自动算量系统
  version: 1.0.0
  debug: false

storage:
  data_path: ./data
  output_path: ./outputs
  log_path: ./logs
  cache_path: ./cache

logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file_max_size: 10485760
  file_backup_count: 5

rule_engine:
  rules_path: ./rules
  specs_path: ./docs/specs

openhuman:
  api_url: https://api.openhuman.ai/v1
  api_key: ''
  timeout: 60

drawing_parser:
  dxf_max_size: 52428800
  pdf_max_size: 104857600
  image_max_size: 52428800

bim_modeling:
  output_format: ifc
  unit: meter