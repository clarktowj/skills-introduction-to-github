# AgnesAI API 配置 (OpenAI Compatible)
# 保存为 config/aginesai_config.yaml

ai_service:
  service_type: openai  # 使用 OpenAI 兼容接口

  openai:
    api_key: "sk-o9HJZWD6ImlQzMcTUtll8AKghTl7ioDYlPQLwVHGuiJp6TMu"
    api_base: "https://apihub.agnes-ai.com/v1"
