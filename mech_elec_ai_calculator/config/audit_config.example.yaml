# OpenHuman API 对接配置
# 支持 OpenAI GPT-4 / Anthropic Claude / 本地规则引擎

# ============================================
# 方式1: 使用本地规则引擎 (无需配置，立即可用)
# ============================================
ai_service:
  service_type: local_rules

# ============================================
# 方式2: 使用 OpenAI GPT-4
# ============================================
# ai_service:
#   service_type: openai
#   openai:
#     api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxx"
#     api_base: "https://api.openai.com/v1"  # 国内可能需要代理
#     model: "gpt-4"
#     temperature: 0.1
#     max_tokens: 4000

# ============================================
# 方式3: 使用 Anthropic Claude
# ============================================
# ai_service:
#   service_type: claude
#   claude:
#     api_key: "sk-ant-xxxxxxxxxxxxxxxxxxxx"
#     model: "claude-3-opus-20240229"
#     max_tokens: 4000

# ============================================
# 高级配置: 优先使用AI，失败时fallback到本地规则
# ============================================
# ai_service:
#   service_type: openai  # 优先使用AI
#   openai:
#     api_key: "${OPENAI_API_KEY}"  # 从环境变量读取
#     model: "gpt-4"
#   enable_fallback: true  # AI失败时自动使用本地规则
